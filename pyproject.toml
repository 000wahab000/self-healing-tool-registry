[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "healer"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["fastapi", "uvicorn", "pydantic>=2", "httpx", "jsonschema", "python-dotenv"]

[project.optional-dependencies]
dev = ["pytest", "pytest-asyncio", "respx", "ruff"]
agents = ["langgraph", "langchain-openai"]
mcp = ["mcp>=2.3,<3"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
